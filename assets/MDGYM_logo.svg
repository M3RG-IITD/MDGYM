<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 150" width="900" height="300">
  <defs>
    <!-- Gradients for modern styling -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00a8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2046;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff9f43;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Hexagon / Gym Shield outline -->
  <path d="M 75 25 L 125 50 L 125 100 L 75 125 L 25 100 L 25 50 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-linejoin="round"/>

  <!-- AI / Benchmarking Bar Chart embedded in the shield -->
  <rect x="90" y="30" width="7" height="15" fill="#0f2046" rx="2"/>
  <rect x="102" y="20" width="7" height="25" fill="#0f2046" rx="2"/>
  <rect x="114" y="5" width="7" height="40" fill="url(#primaryGrad)" rx="2"/>

  <!-- Molecular Graph / Nodes & Edges -->
  <line x1="75" y1="45" x2="100" y2="70" stroke="#00a8ff" stroke-width="2.5"/>
  <line x1="100" y1="70" x2="75" y2="100" stroke="#00a8ff" stroke-width="2.5"/>
  <line x1="75" y1="100" x2="50" y2="75" stroke="#00a8ff" stroke-width="2.5"/>
  <line x1="50" y1="75" x2="75" y2="45" stroke="#00a8ff" stroke-width="2.5"/>
  <line x1="100" y1="70" x2="115" y2="85" stroke="#00a8ff" stroke-width="2.5"/>
  <line x1="50" y1="75" x2="35" y2="95" stroke="#00a8ff" stroke-width="2.5"/>
  
  <!-- Dynamic Orbit Ring -->
  <path d="M 35 75 Q 75 120 120 75" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Atoms / Nodes -->
  <circle cx="75" cy="45" r="8" fill="#0f2046" stroke="#00a8ff" stroke-width="2"/>
  <circle cx="100" cy="70" r="10" fill="url(#accentGrad)"/>
  <circle cx="75" cy="100" r="8" fill="#0f2046" stroke="#00a8ff" stroke-width="2"/>
  <circle cx="50" cy="75" r="8" fill="#0f2046" stroke="#00a8ff" stroke-width="2"/>
  <circle cx="115" cy="85" r="6" fill="#0f2046"/>
  <circle cx="35" cy="95" r="6" fill="url(#accentGrad)"/>

  <!-- MDGYM Typography -->
  <text x="155" y="85" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#0f2046" letter-spacing="1">MDGYM</text>
  
  <!-- Subtitle -->
  <text x="158" y="112" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#4b6584" letter-spacing="1.5">BENCHMARKING AI AGENTS</text>
  <text x="158" y="128" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#4b6584" letter-spacing="1.5">FOR MOLECULAR DYNAMICS</text>
</svg>
